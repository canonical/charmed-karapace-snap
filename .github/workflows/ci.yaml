name: Build and Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v54

  test:
    name: Test Snap (${{ matrix.system.arch }})
    runs-on: ${{ matrix.system.os }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    needs:
      - build
    steps:
      - name: Download snap file
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Install snap file
        run: |
          FILE=$(ls -1 charmed-karapace*${{ matrix.system.arch }}.snap | tail -n1)
          sudo snap install "$FILE" --dangerous

      - name: Check binaries
        run: |
          password_creation=$(charmed-karapace.mkpasswd -u test -a sha512 testpasswd)
          if echo $password_creation | grep -q '"username": "test"'; then
            echo "Password created"
          else
            exit 1
          fi
